# 로컬 개발/테스트용 PostgreSQL + Redis. 앱은 `yarn start:dev` 로 직접 실행합니다.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml exec postgres createdb -U mrshort mrshort_e2e
#
# 이 값들은 개발용이며 운영에서 쓰면 안 됩니다. (.env.example 의 개발용 값과 같습니다)

services:
  postgres:
    image: postgres:13
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: mrshort
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: mrshort
    volumes:
      - dev-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    ports:
      - '6379:6379'
    command: ['redis-server', '--requirepass', 'devpass']

volumes:
  dev-postgres:
